# Reference production topology — NOT the dev stack (that is docker-compose.yml)
# and not a turnkey deployment. It documents how the published images fit
# together so an operator can adapt it to any single-host or orchestrated
# setup. See docs/deployment.md for the full walkthrough.
#
# Assumptions:
#   - Postgres is managed OUTSIDE this file (RDS/Cloud SQL/Neon or an
#     operator-run instance). Production data does not belong in an anonymous
#     compose volume next to the app.
#   - Images come from CI (GHCR) or `make build`:
#       API_IMAGE=ghcr.io/<owner>/<repo>/api:sha-<commit> \
#       WEB_IMAGE=ghcr.io/<owner>/<repo>/web:sha-<commit> \
#       docker compose -f docker-compose.prod.yml up -d
#   - Secrets arrive via the environment (or an env_file kept out of git).
#
# Validate without secrets:  docker compose -f docker-compose.prod.yml config

services:
  # One-shot: same image as the API, overridden to apply embedded migrations,
  # then exits 0 and gates the API start. Idempotent across restarts.
  migrate:
    image: ${API_IMAGE:?e.g. ghcr.io/<owner>/<repo>/api:sha-<commit>}
    command: ["migrate", "up"]
    environment:
      API_ENV: production
      API_DATABASE_URL: ${API_DATABASE_URL:?postgres connection string}
      # Config validation requires this even though migrate never serves.
      API_JWT_SECRET: ${API_JWT_SECRET:?}
    restart: "no"

  api:
    image: ${API_IMAGE:?e.g. ghcr.io/<owner>/<repo>/api:sha-<commit>}
    ports:
      - "8080:8080"
    environment:
      API_ENV: production
      API_HTTP_PORT: 8080
      API_DATABASE_URL: ${API_DATABASE_URL:?postgres connection string}
      API_JWT_SECRET: ${API_JWT_SECRET:?}
      API_JWT_ACCESS_TTL: ${API_JWT_ACCESS_TTL:-15m}
      API_JWT_REFRESH_TTL: ${API_JWT_REFRESH_TTL:-720h}
      API_LOG_LEVEL: ${API_LOG_LEVEL:-info}
      # Only needed when the web app is served from a different origin than
      # the API; same-origin (reverse proxy in front of both) needs no CORS.
      API_CORS_ORIGINS: ${API_CORS_ORIGINS:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    # The image is distroless (no shell, no wget), so there is no compose
    # healthcheck. Point orchestrator HTTP probes at GET /healthz (liveness)
    # and GET /readyz (readiness — pings the DB, 503 when unreachable).
    restart: unless-stopped

  # Static bundle behind unprivileged nginx (uid 101, listens on 8080).
  # VITE_API_URL is baked in at image build time; rebuild the image to point
  # the bundle at a different API origin.
  # No depends_on: nginx serves static files and never talks to the API
  # container — the browser does, through the reverse proxy.
  web:
    image: ${WEB_IMAGE:?e.g. ghcr.io/<owner>/<repo>/web:sha-<commit>}
    ports:
      - "80:8080"
    restart: unless-stopped
