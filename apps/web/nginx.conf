# SPA server block for the production web image (conf.d include; the
# unprivileged base image owns the top-level nginx.conf and worker settings).
server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # nginx add_header does not inherit across levels once a location adds its
    # own headers, so the security set is repeated in every location.

    # Vite emits content-hashed filenames under /assets — safe to cache forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # The API is served by the reverse proxy in front of this container, never
    # by nginx itself. Without this block the SPA fallback would answer /api/*
    # with 200 index.html, turning a proxy mis-route into a silent
    # HTML-where-JSON-expected bug instead of a loud 404.
    location /api/ {
        return 404;
    }

    # Same guard for the root-mounted public statement API (/public/statements,
    # served by the API outside /api/v1): the front proxy owns it, and a
    # mis-route must fail loudly instead of returning index.html as JSON.
    location /public/ {
        return 404;
    }

    # SPA fallback. index.html must revalidate on every request so a new
    # deploy's asset manifest is picked up immediately.
    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri $uri/ /index.html;
    }
}
