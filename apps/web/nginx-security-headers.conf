# Response headers every location of the web image sends. nginx add_header
# does not inherit into a location that sets its own headers, so each location
# includes this snippet next to its Cache-Control instead of repeating the set.
# Installed outside conf.d/ so nginx never loads it as a server block.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# The app is private: no page should be indexed, including token-bearing URLs
# (/invite/*, /reset-password/*) that leak into logs or chat. robots.txt only
# stops crawling; this header stops indexing of URLs a crawler already knows.
add_header X-Robots-Tag "noindex, nofollow" always;
