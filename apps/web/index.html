<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f8f3" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Teka</title>
    <meta name="description" content="Điểm danh, học phí và thông báo phụ huynh trong một nơi." />
    <!-- Link previews (Zalo, Facebook). og:image must be absolute, so the origin is a
         build-time variable. No og:url: one fixed URL would collapse every shared link. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Teka" />
    <meta property="og:title" content="Teka — quản lý lớp dạy thêm" />
    <meta
      property="og:description"
      content="Điểm danh, học phí và thông báo phụ huynh trong một nơi."
    />
    <meta property="og:image" content="%VITE_PUBLIC_ORIGIN%/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
