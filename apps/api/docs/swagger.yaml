basePath: /api/v1
definitions:
  attendance.ConfirmRequest:
    properties:
      absent_student_ids:
        items:
          type: string
        type: array
      note:
        maxLength: 500
        type: string
    type: object
  attendance.Response:
    properties:
      attendance_confirmed_at:
        type: string
      rows:
        items:
          $ref: '#/definitions/attendance.RowResponse'
        type: array
      session_date:
        type: string
      session_id:
        type: string
      status:
        type: string
      warning:
        description: |-
          Warning is set only by Confirm, only when the session's date falls
          inside an already-closed billing period and the automatic
          reconciliation attempt (plan 04) failed. A successful confirm with no
          closed-period implication, or one whose reconciliation succeeded
          (including posting nothing because nothing changed), leaves this nil.
        type: string
    type: object
  attendance.RowResponse:
    properties:
      billable:
        type: boolean
      display_note:
        type: string
      enrollment_id:
        type: string
      note:
        type: string
      status:
        type: string
      student_id:
        type: string
      student_name:
        type: string
    type: object
  audit.ListResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/audit.LogResponse'
        type: array
      next_cursor:
        type: string
    type: object
  audit.LogResponse:
    properties:
      action:
        type: string
      actor_name:
        type: string
      actor_role:
        type: string
      actor_user_id:
        type: string
      entity_id:
        type: string
      entity_type:
        type: string
      id:
        type: string
      ip:
        type: string
      metadata:
        $ref: '#/definitions/audit.Metadata'
      method:
        type: string
      occurred_at:
        type: string
      path:
        type: string
      status_code:
        type: integer
      user_agent:
        type: string
    type: object
  audit.Metadata:
    additionalProperties:
      type: string
    type: object
  auth.ForgotPasswordRequest:
    properties:
      phone:
        type: string
    required:
    - phone
    type: object
  auth.ForgotPasswordResponse:
    properties:
      message:
        type: string
    type: object
  auth.LoginRequest:
    properties:
      password:
        type: string
      phone:
        type: string
    required:
    - password
    - phone
    type: object
  auth.ResetPasswordRequest:
    properties:
      password:
        maxLength: 72
        minLength: 8
        type: string
      token:
        type: string
    required:
    - password
    - token
    type: object
  auth.TokenResponse:
    properties:
      access_token:
        type: string
      expires_in:
        type: integer
      teacher:
        $ref: '#/definitions/teachers.TeacherResponse'
      token_type:
        type: string
    type: object
  billing.AdjustmentRequest:
    properties:
      amount:
        type: integer
      reason:
        maxLength: 500
        minLength: 3
        type: string
    required:
    - amount
    - reason
    type: object
  billing.AdjustmentResponse:
    properties:
      amount:
        type: integer
      created_at:
        type: string
      id:
        type: string
      invoice_id:
        type: string
      reason:
        type: string
      source_session_id:
        type: string
    type: object
  billing.CloseResponse:
    properties:
      issued_count:
        type: integer
      period:
        $ref: '#/definitions/billing.PeriodResponse'
      total_due:
        description: |-
          TotalDue sums total_due across every non-void invoice this close
          produced — the money now owed for the period.
        type: integer
      voided_count:
        type: integer
      warnings:
        $ref: '#/definitions/billing.CloseWarnings'
    type: object
  billing.CloseWarnings:
    properties:
      future_unconfirmed_sessions:
        description: |-
          FutureUnconfirmedSessions are sessions dated after today but still
          inside the period without confirmed attendance — closing early is
          legal (Architecture), so these do not block, but attendance confirmed
          on them later must flow through a phase 4 adjustment on the next
          period rather than this one.
        items:
          $ref: '#/definitions/billing.UnconfirmedSession'
        type: array
    type: object
  billing.EnsurePeriodRequest:
    properties:
      month:
        maximum: 12
        minimum: 1
        type: integer
      year:
        maximum: 2100
        minimum: 2020
        type: integer
    required:
    - month
    - year
    type: object
  billing.InvoiceResponse:
    properties:
      adjustment_total:
        type: integer
      contact_id:
        type: string
      contact_name:
        type: string
      current_charge:
        type: integer
      id:
        type: string
      opening_balance:
        type: integer
      paid_amount:
        type: integer
      period_id:
        type: string
      status:
        type: string
      student_id:
        type: string
      student_name:
        type: string
      total_due:
        type: integer
      void_reason:
        type: string
      voided_at:
        type: string
    type: object
  billing.PeriodResponse:
    properties:
      closed_at:
        type: string
      id:
        type: string
      month:
        type: integer
      period_end:
        type: string
      period_start:
        type: string
      status:
        type: string
      teacher_id:
        type: string
      teacher_name:
        type: string
      year:
        type: integer
    type: object
  billing.PreviewInvoice:
    properties:
      adjustment_total:
        type: integer
      contact_id:
        type: string
      contact_name:
        type: string
      current_charge:
        type: integer
      invoice_id:
        type: string
      lines:
        items:
          $ref: '#/definitions/billing.PreviewLine'
        type: array
      opening_balance:
        type: integer
      student_id:
        type: string
      student_name:
        type: string
      total_due:
        type: integer
    type: object
  billing.PreviewLine:
    properties:
      absent_count:
        type: integer
      amount:
        type: integer
      billable_count:
        type: integer
      class_id:
        type: string
      class_name:
        type: string
      enrollment_id:
        type: string
      present_count:
        type: integer
      unit_price:
        type: integer
    type: object
  billing.PreviewResponse:
    properties:
      invoices:
        items:
          $ref: '#/definitions/billing.PreviewInvoice'
        type: array
      totals:
        $ref: '#/definitions/billing.PreviewTotals'
    type: object
  billing.PreviewTotals:
    properties:
      student_count:
        type: integer
      total_adjustment:
        type: integer
      total_charge:
        type: integer
      total_due:
        type: integer
      total_opening:
        type: integer
    type: object
  billing.UnconfirmedSession:
    properties:
      class_id:
        type: string
      class_name:
        type: string
      session_date:
        type: string
      session_id:
        type: string
      status:
        type: string
    type: object
  billing.VoidInvoiceRequest:
    properties:
      reason:
        maxLength: 500
        minLength: 3
        type: string
    required:
    - reason
    type: object
  centers.CenterResponse:
    properties:
      id:
        type: string
      is_owner:
        type: boolean
      name:
        type: string
    type: object
  centers.MeResponse:
    properties:
      center:
        $ref: '#/definitions/centers.CenterResponse'
      members:
        items:
          $ref: '#/definitions/centers.MemberResponse'
        type: array
      permissions:
        description: |-
          Permissions is the caller's effective permission key list; the owner
          always holds the full catalog (implicit superuser).
        items:
          type: string
        type: array
    type: object
  centers.MemberOverridesRequest:
    properties:
      denies:
        items:
          type: string
        type: array
      grants:
        items:
          type: string
        type: array
    type: object
  centers.MemberPermissionsResponse:
    properties:
      denies:
        items:
          type: string
        type: array
      full_name:
        type: string
      grants:
        items:
          type: string
        type: array
      role_id:
        type: string
      role_key:
        type: string
      teacher_id:
        type: string
    type: object
  centers.MemberResponse:
    properties:
      can_send_reports:
        description: |-
          CanSendReports is the delegated report-sender permission; always false
          for the owner (member-only flag).
        type: boolean
      full_name:
        type: string
      id:
        type: string
      is_owner:
        type: boolean
      phone:
        type: string
    type: object
  centers.MemberRoleRequest:
    properties:
      role_id:
        type: string
    required:
    - role_id
    type: object
  centers.OverviewClassResponse:
    properties:
      avg_attendance:
        description: AvgAttendance is attendance records per held session.
        type: number
      class_id:
        type: string
      class_name:
        type: string
      estimated_revenue:
        description: |-
          EstimatedRevenue sums unit prices of billable records on confirmed
          held sessions — the number that moves as attendance is taken.
        type: integer
      invoiced_revenue:
        description: |-
          InvoicedRevenue is the closed-books number: non-void invoice lines
          plus session-attributed adjustments of the month's closed period.
          Null until the teacher's period for the month is closed. Adjustments
          without a source session belong to no class and are excluded here.
        type: integer
      present_rate:
        description: PresentRate is the share of attendance records marked present.
        type: number
      retention_rate:
        description: |-
          RetentionRate is the share of enrollments active on the month's first
          day still active on its last day.
        type: number
      sessions_held:
        type: integer
    type: object
  centers.OverviewTeacherResponse:
    properties:
      classes:
        items:
          $ref: '#/definitions/centers.OverviewClassResponse'
        type: array
      teacher_id:
        type: string
      teacher_name:
        type: string
    type: object
  centers.PermissionInfo:
    properties:
      key:
        type: string
      label:
        type: string
    type: object
  centers.PermissionsResponse:
    properties:
      catalog:
        items:
          $ref: '#/definitions/centers.PermissionInfo'
        type: array
      members:
        items:
          $ref: '#/definitions/centers.MemberPermissionsResponse'
        type: array
      roles:
        items:
          $ref: '#/definitions/centers.RoleResponse'
        type: array
    type: object
  centers.RenameRequest:
    properties:
      name:
        maxLength: 255
        minLength: 1
        type: string
    required:
    - name
    type: object
  centers.RolePermissionsRequest:
    properties:
      permissions:
        items:
          type: string
        type: array
    type: object
  centers.RoleResponse:
    properties:
      id:
        type: string
      key:
        type: string
      name:
        type: string
      permissions:
        items:
          type: string
        type: array
    type: object
  centers.SessionAttendanceRow:
    properties:
      billable:
        type: boolean
      display_note:
        type: string
      note:
        type: string
      status:
        type: string
      student_id:
        type: string
      student_name:
        type: string
    type: object
  centers.SessionDetailResponse:
    properties:
      attendance:
        items:
          $ref: '#/definitions/centers.SessionAttendanceRow'
        type: array
      estimated_revenue:
        type: integer
      invoiced_revenue:
        description: |-
          InvoicedRevenue is null while no closed billing period covers the
          session's date.
        type: integer
      session:
        $ref: '#/definitions/centers.SessionSummaryResponse'
    type: object
  centers.SessionRowResponse:
    properties:
      attendance_total:
        type: integer
      estimated_revenue:
        type: integer
      present_count:
        type: integer
      session_date:
        type: string
      session_id:
        type: string
      status:
        type: string
    type: object
  centers.SessionSummaryResponse:
    properties:
      attendance_confirmed_at:
        type: string
      class_id:
        type: string
      class_name:
        type: string
      id:
        type: string
      session_date:
        type: string
      status:
        type: string
      teacher_id:
        type: string
    type: object
  centers.TeacherStatsResponse:
    properties:
      active_classes:
        description: ActiveClasses counts their live classes with status active.
        type: integer
      active_students:
        description: |-
          ActiveStudents counts distinct students with an enrollment of theirs
          active today.
        type: integer
      teacher:
        $ref: '#/definitions/centers.MemberResponse'
    type: object
  classes.ClassResponse:
    properties:
      created_at:
        type: string
      default_unit_price:
        type: integer
      end_date:
        type: string
      id:
        type: string
      my_staff_roles:
        description: |-
          MyStaffRoles lists the CALLER's active class_staff role keys on this
          class — per-caller data, so only the readable GET paths fill it (via
          FromModelWithRoles); every other producer, the dashboard included,
          leaves it empty.
        items:
          type: string
        type: array
      name:
        type: string
      schedules:
        items:
          $ref: '#/definitions/classes.ScheduleResponse'
        type: array
      start_date:
        type: string
      status:
        type: string
      teacher_id:
        type: string
    type: object
  classes.CreateClassRequest:
    properties:
      default_unit_price:
        minimum: 0
        type: integer
      end_date:
        type: string
      name:
        maxLength: 100
        minLength: 1
        type: string
      schedules:
        items:
          $ref: '#/definitions/classes.ScheduleRequest'
        minItems: 1
        type: array
      start_date:
        type: string
    required:
    - default_unit_price
    - name
    - schedules
    - start_date
    type: object
  classes.ScheduleRequest:
    properties:
      duration_min:
        minimum: 1
        type: integer
      effective_from:
        description: EffectiveFrom defaults to the class start_date when absent.
        type: string
      effective_to:
        type: string
      start_time:
        type: string
      weekday:
        maximum: 6
        minimum: 0
        type: integer
    required:
    - duration_min
    - start_time
    - weekday
    type: object
  classes.ScheduleResponse:
    properties:
      duration_min:
        type: integer
      effective_from:
        type: string
      effective_to:
        type: string
      id:
        type: string
      start_time:
        type: string
      weekday:
        type: integer
    type: object
  classes.UpdateClassRequest:
    properties:
      default_unit_price:
        minimum: 0
        type: integer
      end_date:
        type: string
      name:
        maxLength: 100
        minLength: 1
        type: string
      start_date:
        type: string
    required:
    - default_unit_price
    - name
    - start_date
    type: object
  classes.UpdateScheduleRequest:
    properties:
      duration_min:
        minimum: 1
        type: integer
      effective_from:
        type: string
      effective_to:
        type: string
      start_time:
        type: string
      weekday:
        maximum: 6
        minimum: 0
        type: integer
    required:
    - duration_min
    - effective_from
    - start_time
    - weekday
    type: object
  classstaff.AssignRequest:
    properties:
      role_key:
        maxLength: 32
        type: string
      teacher_id:
        type: string
    required:
    - role_key
    - teacher_id
    type: object
  classstaff.StaffResponse:
    properties:
      ended_at:
        type: string
      id:
        type: string
      role_key:
        type: string
      role_label:
        type: string
      started_at:
        type: string
      teacher_id:
        type: string
      teacher_name:
        type: string
    type: object
  collections.ClassCollectionRow:
    properties:
      absent_count:
        type: integer
      billable_count:
        type: integer
      class_name:
        type: string
      contact_id:
        type: string
      contact_name:
        type: string
      invoice_id:
        type: string
      invoice_opening_balance:
        type: integer
      invoice_outstanding:
        type: integer
      invoice_paid_amount:
        type: integer
      invoice_total_due:
        type: integer
      line_amount:
        type: integer
      payment_status:
        type: string
      student_id:
        type: string
      student_name:
        type: string
    type: object
  collections.ContactBalanceRow:
    properties:
      contact_archived:
        type: boolean
      contact_id:
        type: string
      full_name:
        type: string
      invoices:
        items:
          $ref: '#/definitions/collections.ContactChildInvoiceRow'
        type: array
      outstanding:
        type: integer
      payment_status:
        type: string
      phone:
        description: |-
          Phone is null unless the caller may see the contact's phone (owner,
          reports oversight, or an active hoc_vu stint over one of the contact's
          enrolled students). The repository always fills it; the service nils it
          by PhoneVisible before the row leaves.
        type: string
      student_count:
        type: integer
      total_due:
        type: integer
      total_paid:
        type: integer
    type: object
  collections.ContactChildInvoiceRow:
    properties:
      invoice_id:
        type: string
      outstanding:
        type: integer
      paid_amount:
        type: integer
      student_name:
        type: string
      total_due:
        type: integer
    type: object
  collections.SummaryResponse:
    properties:
      contact_count:
        type: integer
      paid_contact_count:
        type: integer
      partial_contact_count:
        type: integer
      student_count:
        type: integer
      total_due:
        type: integer
      total_outstanding:
        type: integer
      total_paid:
        type: integer
      unallocated_credit:
        type: integer
      unpaid_contact_count:
        type: integer
    type: object
  contacts.ContactResponse:
    properties:
      created_at:
        type: string
      full_name:
        type: string
      id:
        type: string
      phone:
        type: string
      student_count:
        type: integer
      zalo_name:
        type: string
      zalo_user_id:
        type: string
    type: object
  contacts.CreateRequest:
    properties:
      full_name:
        maxLength: 100
        minLength: 1
        type: string
      phone:
        type: string
    required:
    - full_name
    - phone
    type: object
  contacts.UpdateRequest:
    properties:
      full_name:
        maxLength: 100
        minLength: 1
        type: string
      phone:
        type: string
    required:
    - full_name
    - phone
    type: object
  contacts.ZaloMappingRequest:
    properties:
      zalo_name:
        maxLength: 100
        minLength: 1
        type: string
      zalo_user_id:
        maxLength: 32
        minLength: 1
        type: string
    required:
    - zalo_name
    - zalo_user_id
    type: object
  enrollments.CreateRequest:
    properties:
      class_id:
        type: string
      started_on:
        description: |-
          StartedOn defaults to today when absent. It is stored exactly as
          given — never snapped to a month boundary or the class start date.
        type: string
      student_id:
        type: string
    required:
    - class_id
    - student_id
    type: object
  enrollments.EndRequest:
    properties:
      ended_on:
        type: string
    type: object
  enrollments.EnrollmentResponse:
    properties:
      class_id:
        type: string
      class_name:
        type: string
      created_at:
        type: string
      ended_on:
        type: string
      id:
        type: string
      started_on:
        type: string
      student_id:
        type: string
      student_name:
        type: string
      unit_price:
        type: integer
    type: object
  enrollments.PickerStudent:
    properties:
      full_name:
        type: string
      id:
        type: string
    type: object
  grading.AssignScoreSetRequest:
    properties:
      set_id:
        type: string
    required:
    - set_id
    type: object
  grading.ClassComponentResponse:
    properties:
      id:
        type: string
      name:
        type: string
      position:
        type: integer
    type: object
  grading.ClassComponentsResponse:
    properties:
      class_id:
        type: string
      components:
        items:
          $ref: '#/definitions/grading.ClassComponentResponse'
        type: array
    type: object
  grading.ScoreEntryRequest:
    properties:
      component_id:
        type: string
      score:
        type: number
      student_id:
        type: string
    required:
    - component_id
    - student_id
    type: object
  grading.ScoreResponse:
    properties:
      component_id:
        type: string
      score:
        type: number
      student_id:
        type: string
    type: object
  grading.ScoreSetRequest:
    properties:
      components:
        items:
          type: string
        maxItems: 10
        minItems: 1
        type: array
      name:
        maxLength: 100
        type: string
    required:
    - components
    - name
    type: object
  grading.ScoreSetResponse:
    properties:
      components:
        items:
          type: string
        type: array
      id:
        type: string
      name:
        type: string
    type: object
  grading.SessionScoresResponse:
    properties:
      components:
        items:
          $ref: '#/definitions/grading.ClassComponentResponse'
        type: array
      scores:
        items:
          $ref: '#/definitions/grading.ScoreResponse'
        type: array
    type: object
  handoff.ReassignRequest:
    properties:
      teacher_id:
        type: string
    required:
    - teacher_id
    type: object
  handoff.ReassignResponse:
    properties:
      class_id:
        type: string
      moved_planned_sessions:
        type: integer
      teacher_id:
        type: string
    type: object
  imports.Report:
    properties:
      classes:
        $ref: '#/definitions/imports.ReportEntity'
      committed:
        type: boolean
      contacts:
        $ref: '#/definitions/imports.ReportEntity'
      enrollments:
        $ref: '#/definitions/imports.ReportEntity'
      schedules:
        $ref: '#/definitions/imports.ReportEntity'
      students:
        $ref: '#/definitions/imports.ReportEntity'
    type: object
  imports.ReportEntity:
    properties:
      created:
        type: integer
      reused:
        type: integer
    type: object
  invitations.AcceptRequest:
    properties:
      full_name:
        maxLength: 100
        minLength: 1
        type: string
      password:
        maxLength: 72
        minLength: 8
        type: string
      token:
        type: string
    required:
    - full_name
    - password
    - token
    type: object
  invitations.CreateRequest:
    properties:
      phone:
        type: string
    required:
    - phone
    type: object
  invitations.CreateResponse:
    properties:
      dm_status:
        type: string
      expires_at:
        type: string
      id:
        type: string
      link:
        type: string
      phone:
        type: string
    type: object
  invitations.InvitationResponse:
    properties:
      created_at:
        type: string
      expires_at:
        type: string
      id:
        type: string
      phone:
        type: string
      status:
        type: string
    type: object
  invitations.PreviewRequest:
    properties:
      token:
        type: string
    required:
    - token
    type: object
  invitations.PreviewResponse:
    properties:
      center_name:
        type: string
      phone_masked:
        type: string
    type: object
  notifications.BulkSendRequest:
    properties:
      channel:
        enum:
        - zalo_manual
        - zalo_zns
        - sms
        - zalo_personal
        type: string
      class_id:
        type: string
      purpose:
        enum:
        - statement
        - statements
        - reminder
        type: string
    required:
    - purpose
    type: object
  notifications.BulkSendResponse:
    properties:
      bulk_text:
        description: |-
          BulkText joins every copy-paste row's message, separated by a blank
          line, so a teacher can copy once when pasting into a broadcast tool
          instead of copying each contact's message individually. Rows a
          zalo_personal run delivers itself are excluded.
        type: string
      collapsed_count:
        type: integer
      fallback_manual_count:
        type: integer
      overlap_warning:
        description: |-
          OverlapWarning is set when the other statement dimension already sent
          this period — a family send after a class copy went out, or a class send
          after a family one. Purely informational: parents may receive both, but
          nothing is blocked.
        type: string
      personal_queued_count:
        description: |-
          PersonalQueuedCount and FallbackManualCount split a zalo_personal
          send's rows: mapped contacts the run delivers itself vs unmapped
          contacts left in BulkText for the teacher to copy-paste. Both zero for
          other channels.
        type: integer
      queued_count:
        type: integer
      rows:
        items:
          $ref: '#/definitions/notifications.BulkSendRow'
        type: array
      run_id:
        description: |-
          RunID names the background run auto-sending this call's zalo_personal
          rows; poll GET .../notifications/run for its progress. Null when
          nothing is being auto-sent — the copy-paste channels, or a personal
          send whose every contact was unmapped.
        type: string
      skipped_paid_count:
        type: integer
    type: object
  notifications.BulkSendRow:
    properties:
      channel:
        type: string
      collapsed:
        type: boolean
      contact_id:
        type: string
      contact_name:
        type: string
      message_text:
        type: string
      notification_id:
        type: string
      phone:
        type: string
      purpose:
        type: string
      status:
        type: string
      url:
        type: string
    type: object
  notifications.MarkSentRequest:
    properties:
      ids:
        items:
          type: string
        minItems: 1
        type: array
    required:
    - ids
    type: object
  notifications.NotificationResponse:
    properties:
      channel:
        type: string
      contact_id:
        type: string
      contact_name:
        type: string
      created_at:
        type: string
      error_message:
        description: |-
          ErrorMessage is a failed row's teacher-facing reason — the ledger is
          the only place a teacher can learn why a row was not delivered.
        type: string
      id:
        type: string
      phone:
        description: |-
          Phone is null unless the caller may see the contact's phone (owner,
          reports oversight, or an active hoc_vu stint over one of the contact's
          enrolled students).
        type: string
      purpose:
        type: string
      run_id:
        description: |-
          RunID pins the row to the paced run that sent it, letting a client
          show a run's failures without adopting older runs' rows.
        type: string
      sent_at:
        type: string
      status:
        type: string
    type: object
