            - properties:
                error:
                  $ref: '#/definitions/response.ErrorBody'
              type: object
        "422":
          description: duplicate student, score outside 0–10, or student not on the
            roster
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                error:
                  $ref: '#/definitions/response.ErrorBody'
              type: object
      security:
      - BearerAuth: []
      summary: Save session marks
      tags:
      - teaching
