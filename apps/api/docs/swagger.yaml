      - BearerAuth: []
      summary: Get session component scores
      tags:
      - grading
    put:
      consumes:
      - application/json
      description: Batch merge of per-cell scores. Per entry a value upserts the cell
        and null deletes it; the table never holds empty cells. A new cell requires
        the student to have been on the session's roster; an already-scored student
        stays editable after their enrollment ends. Returns the session's full score
        set after the write. Writable by the session's teacher OR the center owner
        (deliberate divergence from marks, which are teacher-only).
      parameters:
      - description: session id
        in: path
        name: id
        required: true
        type: string
      - description: score entries
        in: body
        name: request
        required: true
        schema:
          items:
            $ref: '#/definitions/grading.ScoreEntryRequest'
