basePath: /api/v1
definitions:
  attendance.ConfirmRequest:
    properties:
      absent_student_ids:
        items:
          type: string
        type: array
      note:
        maxLength: 500
        type: string
    type: object
  attendance.Response:
    properties:
      attendance_confirmed_at:
        type: string
      rows:
        items:
          $ref: '#/definitions/attendance.RowResponse'
        type: array
      session_date:
        type: string
      session_id:
        type: string
      status:
        type: string
    type: object
  attendance.RowResponse:
    properties:
      billable:
        type: boolean
      display_note:
        type: string
      enrollment_id:
        type: string
      note:
        type: string
      status:
        type: string
      student_id:
        type: string
      student_name:
        type: string
    type: object
  auth.LoginRequest:
    properties:
      password:
        type: string
      phone:
        type: string
    required:
    - password
    - phone
    type: object
  auth.RegisterRequest:
    properties:
      full_name:
        maxLength: 100
        minLength: 1
        type: string
      password:
        maxLength: 72
        minLength: 8
        type: string
      phone:
        type: string
    required:
    - full_name
    - password
    - phone
    type: object
  auth.TokenResponse:
    properties:
      access_token:
        type: string
      expires_in:
        type: integer
      teacher:
        $ref: '#/definitions/teachers.TeacherResponse'
      token_type:
        type: string
    type: object
  classes.ClassResponse:
    properties:
      created_at:
        type: string
      default_unit_price:
        type: integer
      end_date:
        type: string
      id:
        type: string
      name:
        type: string
      schedules:
        items:
          $ref: '#/definitions/classes.ScheduleResponse'
        type: array
      start_date:
        type: string
      status:
        type: string
    type: object
  classes.CreateClassRequest:
    properties:
      default_unit_price:
        minimum: 0
        type: integer
      end_date:
        type: string
      name:
        maxLength: 100
        minLength: 1
        type: string
      schedules:
        items:
          $ref: '#/definitions/classes.ScheduleRequest'
        minItems: 1
        type: array
      start_date:
        type: string
    required:
    - default_unit_price
    - name
    - schedules
    - start_date
    type: object
  classes.ScheduleRequest:
    properties:
      duration_min:
        minimum: 1
        type: integer
      effective_from:
        description: EffectiveFrom defaults to the class start_date when absent.
        type: string
      effective_to:
        type: string
      start_time:
        type: string
      weekday:
        maximum: 6
        minimum: 0
        type: integer
    required:
    - duration_min
    - start_time
    - weekday
    type: object
  classes.ScheduleResponse:
    properties:
      duration_min:
        type: integer
      effective_from:
        type: string
      effective_to:
        type: string
      id:
        type: string
      start_time:
        type: string
      weekday:
        type: integer
    type: object
  classes.UpdateClassRequest:
    properties:
      default_unit_price:
        minimum: 0
        type: integer
      end_date:
        type: string
      name:
        maxLength: 100
        minLength: 1
        type: string
      start_date:
        type: string
    required:
    - default_unit_price
    - name
    - start_date
    type: object
  classes.UpdateScheduleRequest:
    properties:
      duration_min:
        minimum: 1
        type: integer
      effective_from:
        type: string
      effective_to:
        type: string
      start_time:
        type: string
      weekday:
        maximum: 6
        minimum: 0
        type: integer
    required:
    - duration_min
    - effective_from
    - start_time
    - weekday
    type: object
  contacts.ContactResponse:
    properties:
      created_at:
        type: string
      full_name:
        type: string
      id:
        type: string
      phone:
        type: string
      student_count:
        type: integer
    type: object
  contacts.CreateRequest:
    properties:
      full_name:
        maxLength: 100
        minLength: 1
        type: string
      phone:
        type: string
    required:
    - full_name
    - phone
    type: object
  contacts.UpdateRequest:
    properties:
      full_name:
        maxLength: 100
        minLength: 1
        type: string
      phone:
        type: string
    required:
    - full_name
    - phone
    type: object
  enrollments.CreateRequest:
    properties:
      class_id:
        type: string
      started_on:
        description: |-
          StartedOn defaults to today when absent. It is stored exactly as
          given — never snapped to a month boundary or the class start date.
        type: string
      student_id:
        type: string
    required:
    - class_id
    - student_id
    type: object
  enrollments.EndRequest:
    properties:
      ended_on:
        type: string
    type: object
  enrollments.EnrollmentResponse:
    properties:
      class_id:
        type: string
      class_name:
        type: string
      created_at:
        type: string
      ended_on:
        type: string
      id:
        type: string
      started_on:
        type: string
      student_id:
        type: string
      student_name:
        type: string
      unit_price:
        type: integer
    type: object
  response.Envelope:
    properties:
      data: {}
      error:
        $ref: '#/definitions/response.ErrorBody'
      meta:
        $ref: '#/definitions/response.Meta'
      success:
        type: boolean
    type: object
  response.ErrorBody:
    properties:
      code:
        type: string
      fields:
        additionalProperties:
          type: string
        type: object
      message:
        type: string
    type: object
  response.Meta:
    properties:
      page:
        type: integer
      per_page:
        type: integer
      total:
        type: integer
      total_pages:
        type: integer
    type: object
  sessions.CancelRequest:
    properties:
      reason:
        maxLength: 500
        minLength: 1
        type: string
    required:
    - reason
    type: object
  sessions.CreateSessionRequest:
    properties:
      session_date:
        type: string
      start_time:
        type: string
    required:
    - session_date
    type: object
  sessions.PendingResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/sessions.PendingSessionResponse'
        type: array
      total:
        type: integer
    type: object
  sessions.PendingSessionResponse:
    properties:
      class_id:
        type: string
      class_name:
        type: string
      days_overdue:
        description: |-
          DaysOverdue is computed from the teacher-timezone cutoff Service.ListPending
          resolved, not stored — it is what makes the warning actionable.
        type: integer
      expected_student_count:
        type: integer
      session_date:
        type: string
      session_id:
        type: string
      start_time:
        type: string
      status:
        type: string
    type: object
  sessions.SessionResponse:
    properties:
      attendance_confirmed_at:
        type: string
      cancel_reason:
        type: string
      class_id:
        type: string
      class_name:
        type: string
      created_at:
        type: string
      id:
        type: string
      session_date:
        type: string
      start_time:
        type: string
      status:
        type: string
      student_count:
        type: integer
    type: object
  students.CreateRequest:
    properties:
      contact_id:
        type: string
      display_note:
        maxLength: 50
        type: string
      full_name:
        maxLength: 100
        minLength: 1
        type: string
    required:
    - contact_id
    - full_name
    type: object
  students.StudentResponse:
    properties:
      contact_id:
        type: string
      contact_name:
        type: string
      contact_phone:
        type: string
      created_at:
        type: string
      display_note:
        type: string
      full_name:
        type: string
      id:
        type: string
    type: object
  students.UpdateRequest:
    properties:
      contact_id:
        type: string
      display_note:
        maxLength: 50
        type: string
      full_name:
        maxLength: 100
        minLength: 1
        type: string
    required:
    - contact_id
    - full_name
    type: object
  teachers.TeacherResponse:
    properties:
      created_at:
        type: string
      full_name:
        type: string
      id:
        type: string
      phone:
        type: string
      status:
        type: string
      timezone:
        type: string
    type: object
  teachers.UpdateProfileRequest:
    properties:
      full_name:
        maxLength: 100
        minLength: 1
        type: string
      timezone:
        maxLength: 64
        type: string
    required:
    - full_name
    - timezone
    type: object
info:
  contact: {}
  description: Backend API for Teka. Every response uses the {success, data, meta,
    error} envelope.
  title: Teka API
  version: "1.0"
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      description: Verifies phone and password; returns an access token and sets the
        refresh cookie (new token family).
      parameters:
      - description: credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/auth.TokenResponse'
              type: object
        "401":
          description: invalid phone or password
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                error:
                  $ref: '#/definitions/response.ErrorBody'
              type: object
        "422":
          description: Unprocessable Entity
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                error:
                  $ref: '#/definitions/response.ErrorBody'
              type: object
      summary: Log in
      tags:
      - auth
  /auth/logout:
    post:
      description: 'Revokes the refresh-token family and clears the cookie. Idempotent:
        succeeds without a valid cookie.'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Envelope'
      summary: Log out
      tags:
      - auth
  /auth/refresh:
    post:
      description: Rotates the refresh-token cookie and returns a fresh access token.
        Replaying an already-rotated token revokes the whole token family.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/auth.TokenResponse'
              type: object
        "401":
          description: missing, expired, or revoked refresh token
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                error:
                  $ref: '#/definitions/response.ErrorBody'
              type: object
      summary: Refresh the session
      tags:
      - auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: Creates a teacher account from a Vietnamese phone number (0xxxxxxxxx
        or +84xxxxxxxxx) and returns an access token; the refresh token is set as
        an httpOnly cookie.
      parameters:
      - description: registration payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/auth.TokenResponse'
              type: object
        "409":
          description: phone already registered
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                error:
                  $ref: '#/definitions/response.ErrorBody'
              type: object
        "422":
          description: validation failed
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                error:
                  $ref: '#/definitions/response.ErrorBody'
              type: object
      summary: Register a new teacher
      tags:
      - auth
  /classes:
    get:
      description: 'status filters the list: active (default), archived, or all.'
      parameters:
      - description: active (default), archived, or all
        in: query
        name: status
        type: string
      - description: page number
        in: query
        name: page
        type: integer
      - description: page size (max 100)
        in: query
        name: per_page
        type: integer
      - description: name, start_date, or created_at; - prefix for desc
        in: query
        name: sort
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/classes.ClassResponse'
                  type: array
                meta:
                  $ref: '#/definitions/response.Meta'
              type: object
        "401":
          description: Unauthorized
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                error:
                  $ref: '#/definitions/response.ErrorBody'
              type: object
        "422":
          description: Unprocessable Entity
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                error:
                  $ref: '#/definitions/response.ErrorBody'
              type: object
      security:
      - BearerAuth: []
      summary: List classes
      tags:
      - classes
    post:
      consumes:
      - application/json
      description: Schedules are required — a class without a timetable generates
        no sessions.
      parameters:
      - description: class fields with schedules
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/classes.CreateClassRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/classes.ClassResponse'
              type: object
        "401":
          description: Unauthorized
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                error:
                  $ref: '#/definitions/response.ErrorBody'
              type: object
        "422":
          description: validation failed
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                error:
                  $ref: '#/definitions/response.ErrorBody'
              type: object
      security:
      - BearerAuth: []
      summary: Create class
      tags:
      - classes
  /classes/{id}:
    delete:
      description: Soft delete for mistakes; blocked with 409 while open enrollments
        exist — archive instead.
      parameters:
      - description: class id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                error:
                  $ref: '#/definitions/response.ErrorBody'
              type: object
        "404":
          description: Not Found
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                error:
                  $ref: '#/definitions/response.ErrorBody'
              type: object
        "409":
          description: open enrollments exist
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                error:
                  $ref: '#/definitions/response.ErrorBody'
              type: object
      security:
      - BearerAuth: []
      summary: Delete class
      tags:
      - classes
    get:
      parameters:
      - description: class id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/classes.ClassResponse'
              type: object
        "401":
          description: Unauthorized
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                error:
                  $ref: '#/definitions/response.ErrorBody'
              type: object
        "404":
          description: Not Found
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                error:
                  $ref: '#/definitions/response.ErrorBody'
              type: object
      security:
      - BearerAuth: []
      summary: Get class
      tags:
      - classes
    put:
      consumes:
      - application/json
      description: Edits name, dates, and default price; schedules and status have
        their own endpoints.
      parameters:
      - description: class id
        in: path
        name: id
        required: true
        type: string
      - description: class fields
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/classes.UpdateClassRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/classes.ClassResponse'
              type: object
        "401":
          description: Unauthorized
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                error:
                  $ref: '#/definitions/response.ErrorBody'
              type: object
        "404":
          description: Not Found
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                error:
                  $ref: '#/definitions/response.ErrorBody'
              type: object
        "422":
          description: Unprocessable Entity
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                error:
                  $ref: '#/definitions/response.ErrorBody'
              type: object
      security:
      - BearerAuth: []
      summary: Update class
      tags:
      - classes
  /classes/{id}/archive:
    post:
      description: Keeps the class in history and reports; use delete only for classes
        created by mistake.
      parameters:
      - description: class id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/classes.ClassResponse'
              type: object
        "401":
          description: Unauthorized
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                error:
                  $ref: '#/definitions/response.ErrorBody'
              type: object
        "404":
          description: Not Found
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                error:
                  $ref: '#/definitions/response.ErrorBody'
              type: object
      security:
      - BearerAuth: []
      summary: Archive class
      tags:
      - classes
  /classes/{id}/schedules:
    post:
      consumes:
      - application/json
      description: Adds a weekly slot; effective_from defaults to the class start
        date.
      parameters:
      - description: class id
        in: path
        name: id
        required: true
        type: string
      - description: schedule fields
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/classes.ScheduleRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/classes.ScheduleResponse'
              type: object
        "401":
          description: Unauthorized
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                error:
                  $ref: '#/definitions/response.ErrorBody'
              type: object
        "404":
          description: Not Found
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                error:
                  $ref: '#/definitions/response.ErrorBody'
              type: object
        "422":
          description: Unprocessable Entity
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                error:
                  $ref: '#/definitions/response.ErrorBody'
              type: object
      security:
      - BearerAuth: []
      summary: Add schedule row
      tags:
      - classes
  /classes/{id}/schedules/{scheduleID}:
    delete:
      parameters:
      - description: class id
        in: path
        name: id
        required: true
        type: string
      - description: schedule id
        in: path
        name: scheduleID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                error:
                  $ref: '#/definitions/response.ErrorBody'
              type: object
        "404":
          description: Not Found
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                error:
                  $ref: '#/definitions/response.ErrorBody'
              type: object
      security:
      - BearerAuth: []
      summary: Delete schedule row
      tags:
      - classes
    put:
      consumes:
      - application/json
      description: For correcting a mistyped row or closing it via effective_to; real
        timetable changes should close the old row and add a new one.
      parameters:
      - description: class id
        in: path
        name: id
        required: true
        type: string
      - description: schedule id
        in: path
        name: scheduleID
        required: true
        type: string
      - description: schedule fields
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/classes.UpdateScheduleRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/classes.ScheduleResponse'
              type: object
        "401":
          description: Unauthorized
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                error:
                  $ref: '#/definitions/response.ErrorBody'
              type: object
        "404":
          description: Not Found
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                error:
                  $ref: '#/definitions/response.ErrorBody'
              type: object
        "422":
          description: Unprocessable Entity
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                error:
                  $ref: '#/definitions/response.ErrorBody'
              type: object
      security:
      - BearerAuth: []
      summary: Update schedule row
      tags:
      - classes
  /classes/{id}/sessions:
    get:
      description: 'Generates any session rows missing for [from, to] from the class''s
        effective schedules, then returns every session in the range — including cancelled
        ones. Idempotent: calling it again with an overlapping range never duplicates
        a row. Range is capped at 400 days.'
      parameters:
      - description: class id
        in: path
        name: id
        required: true
        type: string
      - description: range start, YYYY-MM-DD
        in: query
        name: from
        required: true
        type: string
      - description: range end, YYYY-MM-DD
        in: query
        name: to
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/sessions.SessionResponse'
                  type: array
              type: object
        "401":
          description: Unauthorized
