        allocated_by=manual. Every invoice must belong to the same teacher and the
        same contact as the payment, be issued/partially_paid/paid, and receive no
        more than its outstanding balance; the sum of amounts must not exceed the
        payment. A reversed payment, or a reversal entry itself, cannot be reallocated.
      parameters:
      - description: payment id
        in: path
        name: id
        required: true
        type: string
