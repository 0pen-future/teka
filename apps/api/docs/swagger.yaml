              type: object
      security:
      - BearerAuth: []
      summary: Get session attendance
      tags:
      - attendance
    post:
      consumes:
      - application/json
      description: 'One-touch attendance (PRD R2): pass only the ids of absent students
        — an empty array means everyone was present. Writes one billable record per
        roster student, drops records for students no longer enrolled, and marks the
        session held. Refuses (409) a cancelled session; rejects (422) any absent
        id not on the roster active for the session''s date.'
      parameters:
      - description: session id
        in: path
        name: id
        required: true
        type: string
      - description: absent student ids and optional note
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/attendance.ConfirmRequest'
      produces:
      - application/json
      responses:
        "200":
