basePath: /api/v1
definitions:
  attendance.ConfirmRequest:
    properties:
      absent_student_ids:
        items:
          type: string
        type: array
      note:
        maxLength: 500
        type: string
    type: object
  attendance.Response:
    properties:
      attendance_confirmed_at:
        type: string
      rows:
        items:
          $ref: '#/definitions/attendance.RowResponse'
        type: array
      session_date:
        type: string
      session_id:
        type: string
      status:
        type: string
      warning:
        description: |-
          Warning is set only by Confirm, only when the session's date falls
          inside an already-closed billing period and the automatic
          reconciliation attempt (plan 04) failed. A successful confirm with no
          closed-period implication, or one whose reconciliation succeeded
          (including posting nothing because nothing changed), leaves this nil.
        type: string
    type: object
  attendance.RowResponse:
    properties:
      billable:
        type: boolean
      display_note:
        type: string
      enrollment_id:
        type: string
      note:
        type: string
      status:
        type: string
      student_id:
        type: string
      student_name:
        type: string
    type: object
  auth.LoginRequest:
    properties:
      password:
        type: string
      phone:
        type: string
    required:
    - password
    - phone
    type: object
  auth.RegisterRequest:
    properties:
      full_name:
        maxLength: 100
        minLength: 1
        type: string
      password:
        maxLength: 72
        minLength: 8
        type: string
      phone:
        type: string
    required:
    - full_name
    - password
    - phone
    type: object
  auth.TokenResponse:
    properties:
      access_token:
        type: string
      expires_in:
        type: integer
      teacher:
        $ref: '#/definitions/teachers.TeacherResponse'
      token_type:
        type: string
    type: object
  billing.AdjustmentRequest:
    properties:
      amount:
        type: integer
      reason:
        maxLength: 500
        minLength: 3
        type: string
    required:
    - amount
    - reason
    type: object
  billing.AdjustmentResponse:
    properties:
      amount:
        type: integer
      created_at:
        type: string
      id:
        type: string
      invoice_id:
        type: string
      reason:
        type: string
      source_session_id:
        type: string
    type: object
  billing.CloseResponse:
    properties:
      issued_count:
        type: integer
      period:
        $ref: '#/definitions/billing.PeriodResponse'
      total_due:
        description: |-
          TotalDue sums total_due across every non-void invoice this close
          produced — the money now owed for the period.
        type: integer
      voided_count:
        type: integer
      warnings:
        $ref: '#/definitions/billing.CloseWarnings'
    type: object
  billing.CloseWarnings:
    properties:
      future_unconfirmed_sessions:
        description: |-
          FutureUnconfirmedSessions are sessions dated after today but still
          inside the period without confirmed attendance — closing early is
          legal (Architecture), so these do not block, but attendance confirmed
          on them later must flow through a phase 4 adjustment on the next
          period rather than this one.
        items:
          $ref: '#/definitions/billing.UnconfirmedSession'
        type: array
    type: object
  billing.EnsurePeriodRequest:
    properties:
      month:
        maximum: 12
        minimum: 1
        type: integer
      year:
        maximum: 2100
        minimum: 2020
        type: integer
    required:
    - month
    - year
    type: object
  billing.InvoiceResponse:
    properties:
      adjustment_total:
        type: integer
      contact_id:
        type: string
      contact_name:
        type: string
      current_charge:
        type: integer
      id:
        type: string
      opening_balance:
        type: integer
      paid_amount:
        type: integer
      period_id:
        type: string
      status:
        type: string
      student_id:
        type: string
      student_name:
        type: string
      total_due:
        type: integer
      void_reason:
        type: string
      voided_at:
        type: string
    type: object
  billing.PeriodResponse:
    properties:
      closed_at:
        type: string
      id:
        type: string
      month:
        type: integer
      period_end:
        type: string
      period_start:
        type: string
      status:
        type: string
      year:
        type: integer
    type: object
  billing.PreviewInvoice:
    properties:
      adjustment_total:
        type: integer
      contact_id:
        type: string
      contact_name:
        type: string
      current_charge:
        type: integer
      invoice_id:
        type: string
      lines:
        items:
          $ref: '#/definitions/billing.PreviewLine'
        type: array
      opening_balance:
        type: integer
      student_id:
        type: string
      student_name:
        type: string
      total_due:
        type: integer
    type: object
  billing.PreviewLine:
    properties:
      absent_count:
        type: integer
      amount:
        type: integer
      billable_count:
        type: integer
      class_id:
        type: string
      class_name:
        type: string
      enrollment_id:
        type: string
      present_count:
        type: integer
      unit_price:
        type: integer
    type: object
  billing.PreviewResponse:
    properties:
      invoices:
        items:
          $ref: '#/definitions/billing.PreviewInvoice'
        type: array
      totals:
        $ref: '#/definitions/billing.PreviewTotals'
    type: object
  billing.PreviewTotals:
    properties:
      student_count:
        type: integer
      total_adjustment:
        type: integer
      total_charge:
        type: integer
      total_due:
        type: integer
      total_opening:
        type: integer
    type: object
  billing.UnconfirmedSession:
    properties:
      class_id:
        type: string
      class_name:
        type: string
      session_date:
        type: string
      session_id:
        type: string
      status:
        type: string
    type: object
  billing.VoidInvoiceRequest:
    properties:
      reason:
        maxLength: 500
        minLength: 3
        type: string
    required:
    - reason
    type: object
  centers.CenterResponse:
    properties:
      id:
        type: string
      is_owner:
        type: boolean
      name:
        type: string
    type: object
  centers.JoinRequest:
    properties:
      owner_phone:
        type: string
    required:
    - owner_phone
    type: object
  centers.JoinResponse:
    properties:
      center_id:
        type: string
      joined_at:
        type: string
    type: object
  centers.MeResponse:
    properties:
      center:
        $ref: '#/definitions/centers.CenterResponse'
      members:
        items:
          $ref: '#/definitions/centers.MemberResponse'
        type: array
    type: object
  centers.MemberResponse:
    properties:
      full_name:
        type: string
      id:
        type: string
      is_owner:
        type: boolean
      phone:
        type: string
    type: object
  centers.OverviewClassResponse:
    properties:
      avg_attendance:
        description: AvgAttendance is attendance records per held session.
        type: number
      class_id:
        type: string
      class_name:
        type: string
      estimated_revenue:
        description: |-
          EstimatedRevenue sums unit prices of billable records on confirmed
          held sessions — the number that moves as attendance is taken.
        type: integer
      invoiced_revenue:
        description: |-
          InvoicedRevenue is the closed-books number: non-void invoice lines
          plus session-attributed adjustments of the month's closed period.
          Null until the teacher's period for the month is closed. Adjustments
          without a source session belong to no class and are excluded here.
        type: integer
      present_rate:
        description: PresentRate is the share of attendance records marked present.
        type: number
      retention_rate:
        description: |-
          RetentionRate is the share of enrollments active on the month's first
          day still active on its last day.
        type: number
      sessions_held:
        type: integer
    type: object
  centers.OverviewTeacherResponse:
    properties:
      classes:
        items:
          $ref: '#/definitions/centers.OverviewClassResponse'
        type: array
      teacher_id:
        type: string
      teacher_name:
        type: string
    type: object
  centers.RenameRequest:
    properties:
      name:
        maxLength: 255
        minLength: 1
        type: string
    required:
    - name
    type: object
  centers.SessionAttendanceRow:
    properties:
      billable:
        type: boolean
      display_note:
        type: string
      note:
        type: string
      status:
        type: string
      student_id:
        type: string
      student_name:
        type: string
    type: object
  centers.SessionDetailResponse:
    properties:
      attendance:
        items:
          $ref: '#/definitions/centers.SessionAttendanceRow'
        type: array
      estimated_revenue:
        type: integer
      invoiced_revenue:
        description: |-
          InvoicedRevenue is null while no closed billing period covers the
          session's date.
        type: integer
      session:
        $ref: '#/definitions/centers.SessionSummaryResponse'
    type: object
  centers.SessionRowResponse:
    properties:
      attendance_total:
        type: integer
      estimated_revenue:
        type: integer
      present_count:
        type: integer
      session_date:
        type: string
      session_id:
        type: string
      status:
        type: string
    type: object
  centers.SessionSummaryResponse:
    properties:
      attendance_confirmed_at:
        type: string
      class_id:
        type: string
      class_name:
        type: string
      id:
        type: string
      session_date:
        type: string
      status:
        type: string
      teacher_id:
        type: string
    type: object
  centers.TeacherStatsResponse:
    properties:
      active_classes:
        description: ActiveClasses counts their live classes with status active.
        type: integer
      active_students:
        description: |-
          ActiveStudents counts distinct students with an enrollment of theirs
          active today.
        type: integer
      teacher:
        $ref: '#/definitions/centers.MemberResponse'
    type: object
  classes.ClassResponse:
    properties:
      created_at:
        type: string
      default_unit_price:
        type: integer
      end_date:
        type: string
      id:
        type: string
      name:
        type: string
      schedules:
        items:
          $ref: '#/definitions/classes.ScheduleResponse'
        type: array
      start_date:
        type: string
      status:
        type: string
    type: object
  classes.CreateClassRequest:
    properties:
      default_unit_price:
        minimum: 0
        type: integer
      end_date:
        type: string
      name:
        maxLength: 100
        minLength: 1
        type: string
      schedules:
        items:
          $ref: '#/definitions/classes.ScheduleRequest'
        minItems: 1
        type: array
      start_date:
        type: string
    required:
    - default_unit_price
    - name
    - schedules
    - start_date
    type: object
  classes.ScheduleRequest:
    properties:
      duration_min:
        minimum: 1
        type: integer
      effective_from:
        description: EffectiveFrom defaults to the class start_date when absent.
        type: string
      effective_to:
        type: string
      start_time:
        type: string
      weekday:
        maximum: 6
        minimum: 0
        type: integer
    required:
    - duration_min
    - start_time
    - weekday
    type: object
  classes.ScheduleResponse:
    properties:
      duration_min:
        type: integer
      effective_from:
        type: string
      effective_to:
        type: string
      id:
        type: string
      start_time:
        type: string
      weekday:
        type: integer
    type: object
  classes.UpdateClassRequest:
    properties:
      default_unit_price:
        minimum: 0
        type: integer
      end_date:
        type: string
      name:
        maxLength: 100
        minLength: 1
        type: string
      start_date:
        type: string
    required:
    - default_unit_price
    - name
    - start_date
    type: object
  classes.UpdateScheduleRequest:
    properties:
      duration_min:
        minimum: 1
        type: integer
      effective_from:
        type: string
      effective_to:
        type: string
      start_time:
        type: string
      weekday:
        maximum: 6
        minimum: 0
        type: integer
    required:
    - duration_min
    - effective_from
    - start_time
    - weekday
    type: object
  collections.ClassCollectionRow:
    properties:
      absent_count:
        type: integer
      billable_count:
        type: integer
      class_name:
        type: string
      contact_id:
        type: string
      contact_name:
        type: string
      invoice_id:
        type: string
      invoice_opening_balance:
        type: integer
      invoice_outstanding:
        type: integer
      invoice_paid_amount:
        type: integer
      invoice_total_due:
        type: integer
      line_amount:
        type: integer
      payment_status:
        type: string
      student_id:
        type: string
      student_name:
        type: string
    type: object
  collections.ContactBalanceRow:
    properties:
      contact_archived:
        type: boolean
      contact_id:
        type: string
      full_name:
        type: string
      invoices:
        items:
          $ref: '#/definitions/collections.ContactChildInvoiceRow'
        type: array
      outstanding:
        type: integer
      payment_status:
        type: string
      phone:
        type: string
      student_count:
        type: integer
      total_due:
        type: integer
      total_paid:
        type: integer
    type: object
  collections.ContactChildInvoiceRow:
    properties:
      invoice_id:
        type: string
      outstanding:
        type: integer
      paid_amount:
        type: integer
      student_name:
        type: string
      total_due:
        type: integer
    type: object
  collections.SummaryResponse:
    properties:
      contact_count:
        type: integer
      paid_contact_count:
        type: integer
      partial_contact_count:
        type: integer
      student_count:
        type: integer
      total_due:
        type: integer
      total_outstanding:
        type: integer
      total_paid:
        type: integer
      unallocated_credit:
        type: integer
      unpaid_contact_count:
        type: integer
    type: object
  contacts.ContactResponse:
    properties:
      created_at:
        type: string
      full_name:
        type: string
      id:
        type: string
      phone:
        type: string
      student_count:
        type: integer
      zalo_name:
        type: string
      zalo_user_id:
        type: string
    type: object
  contacts.CreateRequest:
    properties:
      full_name:
        maxLength: 100
        minLength: 1
        type: string
      phone:
        type: string
    required:
    - full_name
    - phone
    type: object
  contacts.UpdateRequest:
    properties:
      full_name:
        maxLength: 100
        minLength: 1
        type: string
      phone:
        type: string
    required:
    - full_name
    - phone
    type: object
  contacts.ZaloMappingRequest:
    properties:
      zalo_name:
        maxLength: 100
        minLength: 1
        type: string
      zalo_user_id:
        maxLength: 32
        minLength: 1
        type: string
    required:
    - zalo_name
    - zalo_user_id
    type: object
  enrollments.CreateRequest:
    properties:
      class_id:
        type: string
      started_on:
        description: |-
          StartedOn defaults to today when absent. It is stored exactly as
          given — never snapped to a month boundary or the class start date.
        type: string
      student_id:
        type: string
    required:
    - class_id
    - student_id
    type: object
  enrollments.EndRequest:
    properties:
      ended_on:
        type: string
    type: object
  enrollments.EnrollmentResponse:
    properties:
      class_id:
        type: string
      class_name:
        type: string
      created_at:
        type: string
      ended_on:
        type: string
      id:
        type: string
      started_on:
        type: string
      student_id:
        type: string
      student_name:
        type: string
      unit_price:
        type: integer
    type: object
  notifications.BulkSendRequest:
    properties:
      channel:
        enum:
        - zalo_manual
        - zalo_zns
        - sms
        - zalo_personal
        type: string
      purpose:
        enum:
        - statement
        - statements
        - reminder
        type: string
    required:
    - purpose
    type: object
  notifications.BulkSendResponse:
    properties:
      bulk_text:
        description: |-
          BulkText joins every copy-paste row's message, separated by a blank
          line, so a teacher can copy once when pasting into a broadcast tool
          instead of copying each contact's message individually. Rows a
          zalo_personal run delivers itself are excluded.
        type: string
      collapsed_count:
        type: integer
      fallback_manual_count:
        type: integer
      personal_queued_count:
        description: |-
          PersonalQueuedCount and FallbackManualCount split a zalo_personal
          send's rows: mapped contacts the run delivers itself vs unmapped
          contacts left in BulkText for the teacher to copy-paste. Both zero for
          other channels.
        type: integer
      queued_count:
        type: integer
      rows:
        items:
          $ref: '#/definitions/notifications.BulkSendRow'
        type: array
      run_id:
        description: |-
          RunID names the background run auto-sending this call's zalo_personal
          rows; poll GET .../notifications/run for its progress. Null when
          nothing is being auto-sent — the copy-paste channels, or a personal
          send whose every contact was unmapped.
        type: string
      skipped_paid_count:
        type: integer
    type: object
  notifications.BulkSendRow:
    properties:
      channel:
        type: string
      collapsed:
        type: boolean
      contact_id:
        type: string
      contact_name:
        type: string
      message_text:
        type: string
      notification_id:
        type: string
      phone:
        type: string
      purpose:
        type: string
      status:
        type: string
      url:
        type: string
    type: object
  notifications.MarkSentRequest:
    properties:
      ids:
        items:
          type: string
        minItems: 1
        type: array
    required:
    - ids
    type: object
  notifications.NotificationResponse:
    properties:
      channel:
        type: string
      contact_id:
        type: string
      contact_name:
        type: string
      created_at:
        type: string
      error_message:
        description: |-
          ErrorMessage is a failed row's teacher-facing reason — the ledger is
          the only place a teacher can learn why a row was not delivered.
        type: string
      id:
        type: string
      phone:
        type: string
      purpose:
        type: string
      run_id:
        description: |-
          RunID pins the row to the paced run that sent it, letting a client
          show a run's failures without adopting older runs' rows.
        type: string
      sent_at:
        type: string
      status:
        type: string
    type: object
  notifications.RunSnapshotResponse:
    properties:
      active:
        type: boolean
      failed:
        type: integer
      purpose:
        type: string
      run_id:
        type: string
      sent:
        type: integer
      status:
        type: string
      total:
        type: integer
    type: object
  payments.AllocationResponse:
    properties:
      allocated_by:
        type: string
      amount:
        type: integer
      invoice_id:
        type: string
      outstanding:
        type: integer
      paid_amount:
        type: integer
      period_id:
        type: string
      student_id:
        type: string
      student_name:
        type: string
      total_due:
        type: integer
    type: object
  payments.PaymentResponse:
    properties:
      allocations:
        items:
          $ref: '#/definitions/payments.AllocationResponse'
        type: array
      amount:
        type: integer
      contact_id:
        type: string
      created_at:
        type: string
      id:
        type: string
      method:
        type: string
      note:
        type: string
      received_on:
        type: string
      reference_code:
        type: string
      reversed_at:
        type: string
      reverses_payment_id:
        type: string
      unallocated_amount:
        type: integer
    type: object
  payments.ReallocateRequest:
    properties:
      allocations:
        items:
          $ref: '#/definitions/payments.ReallocationLine'
        minItems: 1
        type: array
    required:
    - allocations
    type: object
  payments.ReallocationLine:
    properties:
      amount:
        type: integer
      invoice_id:
        type: string
    required:
    - amount
    - invoice_id
    type: object
  payments.RecordPaymentRequest:
    properties:
      amount:
        type: integer
      contact_id:
        type: string
      method:
        enum:
        - cash
        - transfer
        - other
        type: string
      note:
        maxLength: 1000
        type: string
      received_on:
        type: string
      reference_code:
        maxLength: 50
        type: string
    required:
    - amount
    - contact_id
    - method
    - received_on
    type: object
  payments.ReverseRequest:
    properties:
      reason:
        maxLength: 1000
        minLength: 3
        type: string
    required:
    - reason
    type: object
  response.Envelope:
    properties:
      data: {}
      error:
        $ref: '#/definitions/response.ErrorBody'
      meta:
        $ref: '#/definitions/response.Meta'
      success:
        type: boolean
    type: object
  response.ErrorBody:
    properties:
      code:
        type: string
      details:
        description: |-
          Details carries structured error context Fields' map[string]string
          cannot express — e.g. billing's list of unconfirmed sessions blocking a
          period close. Only ErrWithDetails populates it; Err leaves it nil.
      fields:
        additionalProperties:
          type: string
        type: object
      message:
        type: string
    type: object
  response.Meta:
    properties:
      page:
        type: integer
      per_page:
        type: integer
      total:
        type: integer
      total_pages:
        type: integer
    type: object
  sessions.CancelRequest:
    properties:
      reason:
        maxLength: 500
        minLength: 1
        type: string
    required:
    - reason
    type: object
  sessions.CreateSessionRequest:
    properties:
      session_date:
        type: string
      start_time:
        type: string
    required:
    - session_date
    type: object
  sessions.PendingResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/sessions.PendingSessionResponse'
        type: array
      total:
        type: integer
    type: object
  sessions.PendingSessionResponse:
    properties:
      class_id:
        type: string
      class_name:
        type: string
      days_overdue:
        description: |-
          DaysOverdue is computed from the teacher-timezone cutoff Service.ListPending
          resolved, not stored — it is what makes the warning actionable.
        type: integer
      expected_student_count:
        type: integer
      session_date:
        type: string
      session_id:
        type: string
      start_time:
        type: string
      status:
        type: string
    type: object
  sessions.SessionResponse:
    properties:
      attendance_confirmed_at:
        type: string
      cancel_reason:
        type: string
      class_id:
        type: string
      class_name:
        type: string
      created_at:
        type: string
      id:
        type: string
      session_date:
        type: string
      start_time:
        type: string
      status:
        type: string
      student_count:
        type: integer
    type: object
  statements.GenerateResponse:
    properties:
      created:
        type: integer
      refreshed:
        type: integer
      skipped_revoked:
        type: integer
      statements:
        items:
          $ref: '#/definitions/statements.StatementResponse'
        type: array
    type: object
  statements.PublicAdjustment:
    properties:
      amount:
        type: integer
      kind:
        type: string
    type: object
  statements.PublicCarriedAdjustment:
    properties:
      amount:
        type: integer
      session_dates:
        items:
          type: string
        type: array
    type: object
  statements.PublicChild:
    properties:
      adjustments:
        items:
          $ref: '#/definitions/statements.PublicAdjustment'
        type: array
      carried_adjustment:
        $ref: '#/definitions/statements.PublicCarriedAdjustment'
      classes:
        items:
          $ref: '#/definitions/statements.PublicClass'
        type: array
      display_note:
        type: string
      opening_balance:
        type: integer
      student_name:
        type: string
      subtotal:
        type: integer
    type: object
  statements.PublicClass:
    properties:
      absent_count:
        type: integer
      amount:
        type: integer
      billable_count:
        type: integer
      class_name:
        type: string
      sessions:
        items:
          $ref: '#/definitions/statements.PublicSession'
        type: array
      unit_price:
        type: integer
    type: object
  statements.PublicInvoicePayment:
    properties:
      outstanding:
        type: integer
      paid:
        type: integer
      student_name:
        type: string
      total_due:
        type: integer
    type: object
  statements.PublicPayments:
    properties:
      by_invoice:
        items:
          $ref: '#/definitions/statements.PublicInvoicePayment'
        type: array
      total_paid:
        type: integer
    type: object
  statements.PublicQR:
    properties:
      amount:
        type: integer
      image_url:
        type: string
      note:
        type: string
    type: object
  statements.PublicSession:
    properties:
      counted:
        type: boolean
      date:
        type: string
      status:
        type: string
    type: object
  statements.PublicStatement:
    properties:
      children:
        items:
          $ref: '#/definitions/statements.PublicChild'
        type: array
      contact_name:
        type: string
      payments:
        $ref: '#/definitions/statements.PublicPayments'
      period:
        type: string
      qr:
        $ref: '#/definitions/statements.PublicQR'
      totals:
        $ref: '#/definitions/statements.PublicTotals'
    type: object
  statements.PublicTotals:
    properties:
      adjustment_total:
        type: integer
      current_charge:
        type: integer
      opening_balance:
        type: integer
      outstanding:
        type: integer
      paid:
        type: integer
      total_due:
        type: integer
    type: object
  statements.StatementResponse:
    properties:
      contact_id:
        type: string
      contact_name:
        type: string
      expires_at:
        type: string
      first_viewed_at:
        type: string
      id:
        type: string
      last_viewed_at:
        type: string
      phone:
        type: string
      revoked_at:
        type: string
      total_due:
        type: integer
      url:
        type: string
      view_count:
        type: integer
    type: object
  students.CreateRequest:
    properties:
      contact_id:
        type: string
      display_note:
        maxLength: 50
        type: string
      full_name:
        maxLength: 100
        minLength: 1
        type: string
    required:
    - contact_id
    - full_name
    type: object
  students.StudentResponse:
    properties:
      contact_id:
        type: string
      contact_name:
        type: string
      contact_phone:
        type: string
      created_at:
        type: string
      display_note:
        type: string
      full_name:
        type: string
      id:
        type: string
    type: object
  students.UpdateRequest:
    properties:
      contact_id:
        type: string
      display_note:
        maxLength: 50
        type: string
      full_name:
        maxLength: 100
        minLength: 1
        type: string
    required:
    - contact_id
    - full_name
    type: object
  teachers.TeacherResponse:
    properties:
      created_at:
        type: string
      full_name:
        type: string
      id:
        type: string
      phone:
        type: string
      status:
        type: string
      timezone:
        type: string
    type: object
  teachers.UpdateProfileRequest:
    properties:
      full_name:
        maxLength: 100
        minLength: 1
        type: string
      timezone:
        maxLength: 64
        type: string
    required:
    - full_name
    - timezone
    type: object
  zalo.FriendMatchResponse:
    properties:
      avatar:
        type: string
      display_name:
        type: string
      is_friend:
        type: boolean
      matched:
        type: boolean
      phone:
        type: string
      user_id:
        type: string
      zalo_name:
        type: string
    type: object
  zalo.FriendRequestRequest:
    properties:
      message:
        type: string
      user_id:
        type: string
    type: object
  zalo.FriendResponse:
    properties:
      avatar:
        type: string
      display_name:
        type: string
      user_id:
        type: string
    type: object
  zalo.LinkStartRequest:
    properties:
      consent_version:
        type: string
    type: object
  zalo.LinkStartResponse:
    properties:
      link_id:
        type: string
    type: object
  zalo.LinkStatusResponse:
    properties:
      display_name:
        type: string
      error_message:
        type: string
      qr_png:
        type: string
      state:
        type: string
    type: object
  zalo.MatchFriendsRequest:
    properties:
      phones:
        items:
          type: string
        type: array
    type: object
  zalo.StatusResponse:
    properties:
      display_name:
        type: string
      linked:
        type: boolean
      linked_at:
        type: string
      status:
        type: string
    type: object
info:
  contact: {}
  description: Backend API for Teka. Every response uses the {success, data, meta,
    error} envelope.
  title: Teka API
  version: "1.0"
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      description: Verifies phone and password; returns an access token and sets the
        refresh cookie (new token family).
      parameters:
      - description: credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/auth.TokenResponse'
              type: object
        "401":
          description: invalid phone or password
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                error:
                  $ref: '#/definitions/response.ErrorBody'
              type: object
        "422":
          description: Unprocessable Entity
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                error:
                  $ref: '#/definitions/response.ErrorBody'
              type: object
      summary: Log in
      tags:
      - auth
  /auth/logout:
    post:
      description: 'Revokes the refresh-token family and clears the cookie. Idempotent:
        succeeds without a valid cookie.'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Envelope'
      summary: Log out
      tags:
      - auth
  /auth/refresh:
    post:
      description: Rotates the refresh-token cookie and returns a fresh access token.
        Replaying an already-rotated token revokes the whole token family.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/auth.TokenResponse'
              type: object
        "401":
          description: missing, expired, or revoked refresh token
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                error:
                  $ref: '#/definitions/response.ErrorBody'
              type: object
      summary: Refresh the session
      tags:
      - auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: Creates a teacher account from a Vietnamese phone number (0xxxxxxxxx
        or +84xxxxxxxxx) and returns an access token; the refresh token is set as
        an httpOnly cookie.
      parameters:
      - description: registration payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/auth.TokenResponse'
              type: object
        "409":
          description: phone already registered
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                error:
                  $ref: '#/definitions/response.ErrorBody'
              type: object
        "422":
          description: validation failed
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                error:
                  $ref: '#/definitions/response.ErrorBody'
              type: object
      summary: Register a new teacher
      tags:
      - auth
  /billing-periods:
    get:
      parameters:
      - description: page number
        in: query
        name: page
        type: integer
      - description: page size (max 100)
        in: query
        name: per_page
        type: integer
      - description: period_start or created_at; - prefix for desc
        in: query
        name: sort
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/billing.PeriodResponse'
                  type: array
                meta:
                  $ref: '#/definitions/response.Meta'
              type: object
        "401":
          description: Unauthorized
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                error:
                  $ref: '#/definitions/response.ErrorBody'
              type: object
      security:
      - BearerAuth: []
      summary: List billing periods
      tags:
      - billing
    post:
      consumes:
      - application/json
      description: 'Idempotent create-or-get: calling this twice for the same (teacher,
        year, month) returns the same period id rather than a 409.'
      parameters:
      - description: year and month
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/billing.EnsurePeriodRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/billing.PeriodResponse'
              type: object
        "401":
          description: Unauthorized
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                error:
                  $ref: '#/definitions/response.ErrorBody'
              type: object
        "422":
          description: validation failed
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                error:
                  $ref: '#/definitions/response.ErrorBody'
              type: object
      security:
      - BearerAuth: []
      summary: Ensure billing period
      tags:
      - billing
  /billing-periods/{id}:
    get:
      parameters:
      - description: billing period id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/billing.PeriodResponse'
              type: object
        "401":
          description: Unauthorized
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                error:
                  $ref: '#/definitions/response.ErrorBody'
              type: object
        "404":
          description: Not Found
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                error:
                  $ref: '#/definitions/response.ErrorBody'
              type: object
      security:
      - BearerAuth: []
      summary: Get billing period
      tags:
      - billing
  /billing-periods/{id}/close:
    post:
      description: Irreversible. Blocked (409) if any session in the period is past
        due without confirmed attendance — the response names each one. There is no
        reopen.
      parameters:
      - description: billing period id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/billing.CloseResponse'
              type: object
        "401":
          description: Unauthorized
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                error:
                  $ref: '#/definitions/response.ErrorBody'
              type: object
        "404":
          description: Not Found
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                error:
                  $ref: '#/definitions/response.ErrorBody'
              type: object
        "409":
          description: period not open, or has unconfirmed sessions (details.unconfirmed_sessions)
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                error:
                  $ref: '#/definitions/response.ErrorBody'
              type: object
      security:
      - BearerAuth: []
      summary: Close a billing period
      tags:
      - billing
  /billing-periods/{id}/collections:
    get:
      description: view=contact (default) merges every child under one row per family.
        view=class lists one row per invoice line for the given class_id, which is
        required in that view.
      parameters:
      - description: billing period id
        in: path
        name: id
        required: true
        type: string
      - description: contact (default) or class
        in: query
        name: view
        type: string
      - description: required when view=class
        in: query
        name: class_id
        type: string
      - description: unpaid, partial, or paid
        in: query
        name: status
        type: string
      - description: substring match on contact or student name
        in: query
        name: q
        type: string
      - description: page number
        in: query
        name: page
        type: integer
      - description: page size (max 100)
        in: query
        name: per_page
        type: integer
      - description: 'contact view: outstanding (default, desc), full_name, total_due.
          class view: student_name (default), outstanding. - prefix for desc'
        in: query
        name: sort
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/collections.ClassCollectionRow'
                  type: array
                meta:
                  $ref: '#/definitions/response.Meta'
              type: object
        "401":
          description: Unauthorized
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                error:
                  $ref: '#/definitions/response.ErrorBody'
              type: object
        "404":
          description: Not Found
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                error:
                  $ref: '#/definitions/response.ErrorBody'
              type: object
        "422":
          description: validation failed
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                error:
                  $ref: '#/definitions/response.ErrorBody'
              type: object
      security:
      - BearerAuth: []
      summary: List a billing period's collections
      tags:
      - collections
  /billing-periods/{id}/collections/summary:
    get:
      parameters:
      - description: billing period id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/collections.SummaryResponse'
              type: object
        "401":
          description: Unauthorized
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                error:
                  $ref: '#/definitions/response.ErrorBody'
              type: object
        "404":
          description: Not Found
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                error:
                  $ref: '#/definitions/response.ErrorBody'
              type: object
      security:
      - BearerAuth: []
      summary: Summarize a billing period's collections
      tags:
      - collections
  /billing-periods/{id}/draft:
    post:
      description: Only allowed while the period is open. Refuses to touch an invoice
        that has already moved past draft.
      parameters:
      - description: billing period id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/billing.PreviewResponse'
              type: object
        "401":
          description: Unauthorized
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                error:
                  $ref: '#/definitions/response.ErrorBody'
              type: object
        "404":
          description: Not Found
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                error:
                  $ref: '#/definitions/response.ErrorBody'
              type: object
        "409":
          description: period is closed, or an invoice for it has already been issued
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                error:
                  $ref: '#/definitions/response.ErrorBody'
              type: object
      security:
      - BearerAuth: []
      summary: Draft a billing period's invoices
      tags:
      - billing
  /billing-periods/{id}/notifications:
    get:
      parameters:
      - description: billing period id
        in: path
        name: id
        required: true
        type: string
      - description: statements or reminder
        in: query
        name: purpose
        type: string
      - description: queued, sent, delivered, or failed
        in: query
        name: status
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/notifications.NotificationResponse'
                  type: array
              type: object
        "401":
          description: Unauthorized
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                error:
                  $ref: '#/definitions/response.ErrorBody'
              type: object
      security:
      - BearerAuth: []
      summary: List a billing period's notifications
      tags:
      - notifications
  /billing-periods/{id}/notifications/bulk:
    post:
      consumes:
      - application/json
      description: 'Regenerates/refreshes the period''s statements, then queues one
        message per eligible contact: purpose=statement (or "statements") targets
        every contact with a non-void invoice; purpose=reminder further narrows to
        contacts with outstanding > 0. One row per contact, never one per child.'
      parameters:
      - description: billing period id
        in: path
        name: id
        required: true
        type: string
      - description: purpose and optional channel
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/notifications.BulkSendRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/notifications.BulkSendResponse'
              type: object
        "401":
          description: Unauthorized
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                error:
                  $ref: '#/definitions/response.ErrorBody'
              type: object
        "404":
          description: Not Found
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                error:
                  $ref: '#/definitions/response.ErrorBody'
              type: object
        "409":
          description: period is not closed
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                error:
                  $ref: '#/definitions/response.ErrorBody'
              type: object
        "422":
          description: validation failed
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                error:
                  $ref: '#/definitions/response.ErrorBody'
              type: object
      security:
      - BearerAuth: []
      summary: Bulk-send statement notifications
      tags:
      - notifications
  /billing-periods/{id}/notifications/run:
    get:
      description: Returns the period's latest background send run with progress counters
        derived from its rows. A period that never had a run answers active=false
        with a null run_id, not a 404 — poll this after a zalo_personal bulk send
        until active turns false.
      parameters:
      - description: billing period id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/notifications.RunSnapshotResponse'
              type: object
        "401":
          description: Unauthorized
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                error:
                  $ref: '#/definitions/response.ErrorBody'
              type: object
        "404":
          description: Not Found
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                error:
                  $ref: '#/definitions/response.ErrorBody'
              type: object
      security:
      - BearerAuth: []
      summary: Poll a period's zalo_personal run
      tags:
      - notifications
  /billing-periods/{id}/notifications/run/resume:
    post:
      description: Re-renders and re-sends only the run's still-queued rows; rows
        already sent keep their verdict. Only a run in the interrupted state qualifies.
        Rows that can no longer be auto-sent (mapping removed, balance since paid)
        are failed with a reason.
      parameters:
      - description: billing period id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/notifications.RunSnapshotResponse'
              type: object
        "400":
          description: no linked Zalo account
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                error:
                  $ref: '#/definitions/response.ErrorBody'
              type: object
        "401":
          description: Unauthorized
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                error:
                  $ref: '#/definitions/response.ErrorBody'
              type: object
        "404":
          description: period has no run
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                error:
                  $ref: '#/definitions/response.ErrorBody'
              type: object
        "409":
          description: run is not interrupted, another run is sending, or the Zalo
            session expired
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                error:
                  $ref: '#/definitions/response.ErrorBody'
              type: object
      security:
      - BearerAuth: []
      summary: Resume an interrupted zalo_personal run
      tags:
      - notifications
  /billing-periods/{id}/preview:
    get:
      description: Pure read — never creates or updates invoices. Every student with
        a billable session or carried debt from the previous closed period appears
        once with one line per class.
      parameters:
      - description: billing period id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
