  /sessions/{id}/marks:
    put:
      consumes:
      - application/json
      description: 'Batch merge of per-student marks. Per entry, score and personal_note
        are tri-state: omitted leaves the stored value, null clears it, a value sets
        it; a row whose resulting fields are both NULL is deleted. A new row requires
        the student to have been on the session''s roster; a student''s existing row
        stays editable and clearable after their enrollment ends. Returns the session''s
        full mark set after the write. Session-teacher only.'
      parameters:
      - description: session id
        in: path
        name: id
        required: true
        type: string
      - description: mark entries
        in: body
        name: request
        required: true
        schema:
          items:
            $ref: '#/definitions/teaching.MarkEntryRequest'
          type: array
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/teaching.MarkResponse'
                  type: array
              type: object
        "401":
          description: Unauthorized
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                error:
                  $ref: '#/definitions/response.ErrorBody'
              type: object
        "403":
          description: caller is not the session's teacher
