      description: 'Regenerates/refreshes the period''s statements, then queues one
        message per eligible contact: purpose=statement (or "statements") targets
        every contact with a non-void invoice; purpose=reminder further narrows to
        contacts with outstanding > 0. One row per contact, never one per child. With
        class_id in the body, sends that class''s class-scoped statement copies instead
        — gated by class-send access (active sending-role stint or reports oversight)
        rather than the send-reports permission.'
      parameters:
      - description: billing period id
        in: path
        name: id
        required: true
        type: string
      - description: purpose, optional channel, optional class_id
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/notifications.BulkSendRequest'
      produces:
