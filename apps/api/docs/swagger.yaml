info:
  contact: {}
  description: Backend API for Teka. Every response uses the {success, data, meta,
    error} envelope.
  title: Teka API
  version: "1.0"
paths:
  /audit-logs:
    get:
      description: Owner-only. Keyset-paginated, newest first; pass next_cursor back
        to fetch the following page. A cursor is only valid alongside the same filters
        that produced it.
      parameters:
      - description: filter by actor teacher id (UUID)
        in: query
        name: actor_id
        type: string
      - description: action prefix, e.g. class. or auth.login
        in: query
        name: action
        type: string
      - description: RFC3339 lower bound on occurred_at
        in: query
        name: from
        type: string
      - description: RFC3339 upper bound on occurred_at
        in: query
        name: to
        type: string
      - description: opaque cursor from a previous page
        in: query
        name: cursor
        type: string
      - description: page size (default 50, max 100; out-of-range values are clamped)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/audit.ListResponse'
              type: object
        "400":
          description: malformed filter or cursor
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                error:
                  $ref: '#/definitions/response.ErrorBody'
              type: object
        "401":
          description: Unauthorized
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                error:
                  $ref: '#/definitions/response.ErrorBody'
              type: object
        "403":
          description: caller is not the center owner
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                error:
                  $ref: '#/definitions/response.ErrorBody'
              type: object
      security:
      - BearerAuth: []
      summary: List audit logs
      tags:
      - audit-logs
  /auth/forgot-password:
    post:
      consumes:
      - application/json
      description: 'Public, unauthenticated. Always returns the same generic body:
        whether the phone matched an eligible account (an active, non-owner member)
        is never revealed. Delivery is best-effort over the center owner''s linked
        Zalo — owners themselves are excluded and recover via operator CLI only.'
      parameters:
      - description: phone
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.ForgotPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/auth.ForgotPasswordResponse'
              type: object
        "422":
          description: validation failed
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                error:
                  $ref: '#/definitions/response.ErrorBody'
              type: object
        "429":
          description: Too Many Requests
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                error:
                  $ref: '#/definitions/response.ErrorBody'
              type: object
      summary: Request a password reset
      tags:
      - auth
  /auth/login:
    post:
      consumes:
      - application/json
      description: Verifies phone and password; returns an access token and sets the
        refresh cookie (new token family).
      parameters:
      - description: credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/auth.TokenResponse'
              type: object
        "401":
          description: invalid phone or password
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                error:
                  $ref: '#/definitions/response.ErrorBody'
              type: object
        "422":
          description: Unprocessable Entity
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                error:
                  $ref: '#/definitions/response.ErrorBody'
              type: object
      summary: Log in
      tags:
      - auth
  /auth/logout:
    post:
      description: 'Revokes the refresh-token family and clears the cookie. Idempotent:
        succeeds without a valid cookie.'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Envelope'
      summary: Log out
      tags:
      - auth
  /auth/refresh:
    post:
      description: Rotates the refresh-token cookie and returns a fresh access token.
        Replaying an already-rotated token revokes the whole token family.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/auth.TokenResponse'
              type: object
        "401":
          description: missing, expired, or revoked refresh token
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                error:
                  $ref: '#/definitions/response.ErrorBody'
              type: object
      summary: Refresh the session
      tags:
      - auth
  /auth/reset-password:
    post:
      consumes:
      - application/json
      description: Public, unauthenticated. Token travels in the body. Every rejection
        reason — unknown/used/expired/superseded token, or an account no longer active
        — answers the same generic 400 body, by design (anti-enumeration). On success,
        every refresh token the account held is revoked.
      parameters:
      - description: token and new password
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.ResetPasswordRequest'
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                error:
                  $ref: '#/definitions/response.ErrorBody'
              type: object
        "422":
          description: validation failed
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                error:
                  $ref: '#/definitions/response.ErrorBody'
              type: object
        "429":
          description: Too Many Requests
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                error:
                  $ref: '#/definitions/response.ErrorBody'
              type: object
      summary: Reset password
