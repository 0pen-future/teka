  /me/zalo:
    delete:
      description: 'Cancels any attempt in flight, drops the live session, and removes
        the stored credentials. Idempotent: answers 204 whether or not an account
        was linked.'
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                error:
                  $ref: '#/definitions/response.ErrorBody'
              type: object
      security:
      - BearerAuth: []
      summary: Unlink the Zalo account
      tags:
      - zalo
    get:
      description: Reads zalo_accounts only — no request reaches Zalo. Having no linked
        account is a normal answer ({"linked":false}), not a 404. status is "linked"
        or "expired"; the background health check keeps it fresh, so a session that
        died since its last use can already read expired.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/zalo.StatusResponse'
              type: object
        "401":
          description: Unauthorized
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                error:
                  $ref: '#/definitions/response.ErrorBody'
              type: object
      security:
      - BearerAuth: []
      summary: Zalo link status
      tags:
      - zalo
  /me/zalo/friends:
    get:
      description: Fetches the linked account's friend list live from Zalo for the
        contact-mapping picker. The chosen friend is stored via PUT /contacts/{id}/zalo-mapping;
        nothing is persisted here. 404 when no account is linked, 409 when the stored
        session no longer works.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/zalo.FriendResponse'
                  type: array
              type: object
        "401":
          description: Unauthorized
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                error:
                  $ref: '#/definitions/response.ErrorBody'
              type: object
        "404":
          description: no linked account
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                error:
                  $ref: '#/definitions/response.ErrorBody'
              type: object
        "409":
          description: session expired
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                error:
                  $ref: '#/definitions/response.ErrorBody'
              type: object
      security:
      - BearerAuth: []
      summary: List Zalo friends
      tags:
      - zalo
  /me/zalo/friends/match:
    post:
      consumes:
      - application/json
      description: Looks up 1–200 phone numbers against Zalo in paced chunks, intersects
        the hits with the linked account's friend list, and returns one row per phone
        in request order. Rows echo the phone exactly as sent; unresolved phones come
        back matched=false. Owner and send-reports holders match any phone; an active
        hoc_vu matches only phones of contacts their assignments make phone-visible
        (out-of-reach phones come back matched=false without a lookup); other staff
        get 403. Nothing is persisted — confirming a suggestion goes through PUT /contacts/{id}/zalo-mapping.
        404 when no account is linked, 409 when the stored session no longer works.
      parameters:
      - description: phones to look up
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/zalo.MatchFriendsRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/zalo.FriendMatchResponse'
                  type: array
              type: object
        "400":
          description: empty or oversized phone list
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                error:
                  $ref: '#/definitions/response.ErrorBody'
              type: object
        "401":
          description: Unauthorized
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                error:
                  $ref: '#/definitions/response.ErrorBody'
              type: object
        "403":
          description: caller has neither oversight nor an active hoc_vu assignment
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                error:
                  $ref: '#/definitions/response.ErrorBody'
              type: object
        "404":
          description: no linked account
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                error:
                  $ref: '#/definitions/response.ErrorBody'
              type: object
        "409":
          description: session expired
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                error:
                  $ref: '#/definitions/response.ErrorBody'
              type: object
      security:
      - BearerAuth: []
      summary: Match phones against Zalo accounts
      tags:
      - zalo
