version: "2"

linters:
  default: none
  enable:
    - govet
    - errcheck
    - staticcheck
    - revive
    - gosec
    - ineffassign
    - misspell
    - forbidigo
  settings:
    forbidigo:
      forbid:
        - pattern: os\.(Getenv|LookupEnv)
          msg: read configuration through internal/config, not the raw environment
  exclusions:
    rules:
      # Tests favor readability over hardened patterns.
      - path: _test\.go
        linters:
          - gosec
      # config is the one package allowed to read the environment.
      - path: internal/config/
        linters:
          - forbidigo
      # The Zalo protocol package is a port of a reverse-engineered wire format.
      # md5 there is dictated by Zalo (IMEI, request signing, key derivation), so
      # it cannot be substituted, and the wire structs stay comment-free so that
      # re-porting upstream changes remains a diff rather than a rewrite.
      - path: internal/features/zalo/protocol/
        linters:
          - gosec
        text: "(G401|G501)"
      - path: internal/features/zalo/protocol/
        linters:
          - revive
        text: "exported:"

formatters:
  enable:
    - gofmt
    - gci
  settings:
    gci:
      sections:
        - standard
        - default
        - localmodule
