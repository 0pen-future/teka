# Local dev stack: `make dev` (up) / `make dev-down` (stop) / `make dev-nuke`
# (stop + wipe volumes). Configuration comes from the repo-root .env (created
# by `make setup`); every ${VAR} below is compose interpolation, and each
# service receives only its own variables. Ports are deterministic — on
# "address already in use", stop the stale owner (lsof -i :PORT), never remap.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-teka}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-teka_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-teka}
    ports:
      # Loopback only: the dev password is committed, so never expose the DB
      # to the LAN. Same for adminer below.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Extensions only; schema is owned by the migrations.
      - ./infrastructure/docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-teka} -d ${POSTGRES_DB:-teka}"]
      interval: 3s
      timeout: 3s
      retries: 10

  # One-shot: applies embedded migrations, exits 0, and gates the API start.
  # Idempotent, so compose restarts are safe.
  migrate:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.dev
    command: ["go", "run", "./cmd/api", "migrate", "up"]
    environment:
      API_ENV: development
      API_DATABASE_URL: postgres://${POSTGRES_USER:-teka}:${POSTGRES_PASSWORD:-teka_dev_password}@postgres:5432/${POSTGRES_DB:-teka}?sslmode=disable
      # Config validation requires these even though migrate never serves.
      API_JWT_SECRET: ${API_JWT_SECRET:?set in .env — run 'make setup'}
    volumes:
      - ./apps/api:/app
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.dev
    ports:
      - "${API_HTTP_PORT:-8080}:8080"
    environment:
      API_ENV: ${API_ENV:-development}
      API_HTTP_PORT: 8080
      API_DATABASE_URL: postgres://${POSTGRES_USER:-teka}:${POSTGRES_PASSWORD:-teka_dev_password}@postgres:5432/${POSTGRES_DB:-teka}?sslmode=disable
      API_JWT_SECRET: ${API_JWT_SECRET:?set in .env — run 'make setup'}
      API_JWT_ACCESS_TTL: ${API_JWT_ACCESS_TTL:-15m}
      API_JWT_REFRESH_TTL: ${API_JWT_REFRESH_TTL:-720h}
      API_LOG_LEVEL: ${API_LOG_LEVEL:-debug}
      # Browser traffic is same-origin through the Vite proxy; this allowlist
      # only covers direct-port usage (curl, host-mode web).
      API_CORS_ORIGINS: ${API_CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      # Dev fallback: unset gets a per-process generated key (logged as a
      # fingerprint, never the key itself) — fine locally, never for prod.
      API_STATEMENTS_TOKEN_KEY: ${API_STATEMENTS_TOKEN_KEY:-}
      API_STATEMENTS_PUBLIC_BASE_URL: ${API_STATEMENTS_PUBLIC_BASE_URL:-http://localhost:5173}
      # Optional VietQR transfer target; blank omits the QR from statements.
      API_BANK_CODE: ${API_BANK_CODE:-}
      API_BANK_ACCOUNT_NUMBER: ${API_BANK_ACCOUNT_NUMBER:-}
      API_BANK_ACCOUNT_NAME: ${API_BANK_ACCOUNT_NAME:-}
      API_NOTIFICATIONS_DEFAULT_CHANNEL: ${API_NOTIFICATIONS_DEFAULT_CHANNEL:-zalo_manual}
      API_NOTIFICATIONS_MAX_MESSAGE_LEN: ${API_NOTIFICATIONS_MAX_MESSAGE_LEN:-1000}
    volumes:
      - ./apps/api:/app
      - go-mod-cache:/go/pkg/mod
      # Shared with migrate (safe: migrate exits before api starts, and the Go
      # build cache is concurrency-safe anyway). Keeps warm restarts fast.
      - go-build-cache:/root/.cache/go-build
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12
      # First start compiles the whole module tree via air.
      start_period: 120s

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile.dev
    ports:
      - "${WEB_PORT:-5173}:5173"
    environment:
      # Same-origin through the Vite proxy: no CORS, no cookie SameSite pain.
      VITE_API_URL: /api/v1
      WEB_API_PROXY_TARGET: http://api:8080
      # Set to "true" if Docker Desktop drops file events across the bind
      # mount and HMR stops firing.
      WEB_USE_POLLING: ${WEB_USE_POLLING:-false}
    volumes:
      - ./apps/web:/app
      # Anonymous volume: container-owned node_modules (linux binaries) shadow
      # whatever the host has.
      - /app/node_modules
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:5173/"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 30s

  adminer:
    image: adminer:5
    ports:
      - "127.0.0.1:${ADMINER_PORT:-8081}:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
  go-mod-cache:
  go-build-cache:
