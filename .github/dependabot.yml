# Weekly dependency updates, minor/patch grouped per ecosystem so routine
# bumps arrive as one reviewable PR; majors stay individual.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /apps/api
    schedule:
      interval: weekly
    groups:
      go-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /apps/web
    schedule:
      interval: weekly
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: typescript
        versions: [">=7 <8"]
      # 30.1.0 breaks menus, focus return and File uploads under vitest;
      # 30.1.1 still fails FormData uploads through axios. Later releases
      # arrive as usual and CI decides.
      - dependency-name: jsdom
        versions: ["30.1.0", "30.1.1"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      root-npm-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directories:
      - /apps/api
      - /apps/web
    schedule:
      interval: weekly
