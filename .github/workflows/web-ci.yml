# Path-filtered frontend pipeline: lint/format/types and unit tests with a
# coverage artifact. The full-stack Playwright e2e job is quarantined to
# master pushes so the PR loop stays fast. The production image is built and
# pushed by web-release.yml on version tags — an accepted trade-off: the
# production Dockerfile is not exercised on PRs or master pushes (only by the
# weekly trivy job in security.yml), so a build break surfaces at release-tag
# time.
name: Web CI

on:
  pull_request:
    paths:
      - "apps/web/**"
      - ".github/workflows/web-ci.yml"
      # The e2e job consumes the compose stack and its env contract.
      - "Makefile"
      - "docker-compose.yml"
      - ".env.example"
  push:
    branches: [master]
    paths:
      - "apps/web/**"
      - ".github/workflows/web-ci.yml"
      - "Makefile"
      - "docker-compose.yml"
      - ".env.example"

concurrency:
  group: web-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: apps/web

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      # Same checks as `make lint-web`.
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      # Same script locally and in CI — no CI-only invocation drift.
      - run: npm run test:coverage
      - uses: actions/upload-artifact@v7
        with:
          name: web-coverage
          path: apps/web/coverage
          retention-days: 14

  e2e:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      # npm ci must run before the stack starts: compose bind-mounts
      # ./apps/web with an anonymous node_modules volume, and if the host
      # directory doesn't exist yet Docker creates the mountpoint root-owned,
      # which makes a later npm ci fail with EACCES.
      - run: npm ci
      # Compose interpolates the repo-root .env; the example values are the
      # dev-stack defaults and contain no real secrets.
      - name: Create .env from example
        working-directory: .
        run: cp .env.example .env
      - name: Start the dev stack
        working-directory: .
        run: docker compose up -d --build
      # web healthy transitively implies api healthy (depends_on), and web is
      # what Playwright actually targets. Generous budget: a cold runner
      # compiles the Go module tree twice (migrate, then api under air).
      - name: Wait for the stack to be healthy
        working-directory: .
        run: |
          for _ in $(seq 1 120); do
            if [ "$(docker compose ps web --format '{{.Health}}')" = "healthy" ]; then
              exit 0
            fi
            sleep 5
          done
          echo "web never became healthy" >&2
          docker compose ps >&2
          docker compose logs api web >&2
          exit 1
      - name: Seed test users
        working-directory: .
        run: docker compose run --rm migrate go run ./cmd/api seed
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-artifacts
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7
      - name: Tear down the stack
        working-directory: .
        if: always()
        run: docker compose down -v
