# Path-filtered backend pipeline: lint, tests (with coverage floor), and
# swagger drift. Every check step runs the same make target as local dev. The
# production image is built and pushed by api-release.yml on version tags —
# an accepted trade-off: the production Dockerfile is not exercised on PRs or
# master pushes (only by the weekly trivy job in security.yml), so a build
# break surfaces at release-tag time.
name: API CI

on:
  pull_request:
    paths:
      - "apps/api/**"
      - ".github/workflows/api-ci.yml"
      # CI runs make targets, so Makefile edits must trigger this pipeline.
      - "Makefile"
  push:
    branches: [master]
    paths:
      - "apps/api/**"
      - ".github/workflows/api-ci.yml"
      - "Makefile"

concurrency:
  group: api-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.7.2
          working-directory: apps/api

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum
      # Integration tests use testcontainers; ubuntu runners ship with Docker.
      - run: make test-api

  swagger-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum
      - run: make api-docs
      # git status (not diff) so newly-untracked generated files also fail.
      - name: Fail if generated OpenAPI spec is stale
        run: |
          if [ -n "$(git status --porcelain -- apps/api/docs)" ]; then
            git status --porcelain -- apps/api/docs
            echo "OpenAPI spec is stale — run 'make api-docs' and commit" >&2
            exit 1
          fi
