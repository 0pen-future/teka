# Path-filtered backend pipeline: lint, tests (with coverage floor), swagger
# drift, and the production image. Pushes to GHCR only on main; PRs build
# without pushing. Every check step runs the same make target as local dev.
name: API CI

on:
  pull_request:
    paths:
      - "apps/api/**"
      - ".github/workflows/api-ci.yml"
      # CI runs make targets, so Makefile edits must trigger this pipeline.
      - "Makefile"
  push:
    branches: [master]
    paths:
      - "apps/api/**"
      - ".github/workflows/api-ci.yml"
      - "Makefile"

concurrency:
  group: api-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.7.2
          working-directory: apps/api

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum
      # Integration tests use testcontainers; ubuntu runners ship with Docker.
      - run: make test-api

  swagger-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum
      - run: make api-docs
      # git status (not diff) so newly-untracked generated files also fail.
      - name: Fail if generated OpenAPI spec is stale
        run: |
          if [ -n "$(git status --porcelain -- apps/api/docs)" ]; then
            git status --porcelain -- apps/api/docs
            echo "OpenAPI spec is stale — run 'make api-docs' and commit" >&2
            exit 1
          fi

  build:
    needs: [lint, test, swagger-drift]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}/api
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v6
        with:
          context: apps/api
          build-args: |
            GIT_SHA=${{ github.sha }}
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
